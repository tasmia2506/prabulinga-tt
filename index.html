    <!-- Structured Data (JSON-LD) — read by Google (rich results), and by AI
         crawlers/answer engines (ChatGPT, Perplexity, Google AI Overviews)
         since it's static HTML, not JS-rendered, so it's visible even to
         crawlers that don't execute JavaScript. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Prabhuling Travel Agency & Online Services",
      "alternateName": "Prabhuling Travels",
      "url": "https://www.prabhulingtravels.com/",
      "logo": "https://www.prabhulingtravels.com/logo.jpg",
      "image": "https://www.prabhulingtravels.com/home2.jfif",
      "telephone": "+91-80501-72818",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Near Nivaragi Textile, Beside Savalagi Garage, Rabakavi Main Road",
        "addressLocality": "Terdal",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "areaServed": [
        { "@type": "State", "name": "Karnataka" },
        { "@type": "Country", "name": "India" }
      ],
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
        "opens": "10:00",
        "closes": "19:00"
      },
      "sameAs": [],
      "makesOffer": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bus Ticket Booking" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Flight Ticket Booking" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Train Ticket Booking" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Tour & Holiday Packages" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Bus & Vehicle Rental" } }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I book a bus ticket with Prabhuling Travel Agency?",
          "acceptedAnswer": { "@type": "Answer", "text": "You can book directly through our website's booking form, call our agency desk, or message us on WhatsApp. Our team confirms your seat instantly with zero hidden charges." }
        },
        {
          "@type": "Question",
          "name": "Do you operate your own buses or resell third-party tickets?",
          "acceptedAnswer": { "@type": "Answer", "text": "We directly own & operate our 3-bus luxury fleet across AC/Non-AC sleeper & seater coaches, so you always deal with the fleet owner, not a reseller." }
        },
        {
          "@type": "Question",
          "name": "Can I book flights & train tickets through the same agency?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Alongside our bus fleet, our desk team assists with domestic & international flight bookings, railway reservations, Tatkal guidance, & PNR status tracking." }
        },
        {
          "@type": "Question",
          "name": "Do you offer custom holiday packages for groups & families?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, we curate all-inclusive tour packages with dedicated bus transfers, hotel stays, & guided sightseeing across South India's heritage, coastal, & hill-station destinations." }
        },
        {
          "@type": "Question",
          "name": "What if I need to cancel or reschedule my booking?",
          "acceptedAnswer": { "@type": "Answer", "text": "Contact our support desk via phone or WhatsApp with your booking reference. Our human team will guide you through rescheduling or refund options directly — no automated bots." }
        },
        {
          "@type": "Question",
          "name": "Can I hire a full bus for a private event or corporate trip?",
          "acceptedAnswer": { "@type": "Answer", "text": "Absolutely. Our fleet is available for private charter — weddings, corporate retreats, school trips, & pilgrimages — with flexible hour/km hire & verified drivers." }
        }
      ]
    }
    </script>
